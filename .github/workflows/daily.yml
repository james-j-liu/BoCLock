name: Daily update & deploy

on:
  schedule:
    - cron: "0 7 * * *"         # 07:00 UTC daily (the Bank publishes during Ottawa daytime)
  workflow_dispatch:             # allow manual runs from the Actions tab
    inputs:
      backfill_senate:
        description: "First ingest every Senate Banking Committee hearing (all sessions)"
        type: boolean
        default: false
  push:
    branches: [main]             # redeploy the site on every code/data change
                                 # (the job's own commit uses GITHUB_TOKEN, which
                                 # by design does not re-trigger workflows)

permissions:
  contents: write                # commit refreshed corpus/log/data back to the repo
  pages: write                   # publish to GitHub Pages
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip          # reuse installed wheels instead of rebuilding each morning
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore the page cache
        # a backfill cut short resumes from the pages it already fetched
        uses: actions/cache@v4
        with:
          path: data/raw/boc_cache
          key: boc-cache-${{ github.run_id }}
          restore-keys: boc-cache-
      - name: Backfill Senate hearings
        # sencanada.ca blocks an IP for hours after a burst of requests, so the full
        # Senate history can be fetched from here instead of a local machine. Run it
        # from the Actions tab, or by pushing data/processed/backfill_senate.request
        # (removed again once the backfill has run).
        # Whatever it fetches is committed at once, so a later failure cannot lose it,
        # and the request is only removed when the whole backfill got through.
        if: ${{ github.event.inputs.backfill_senate == 'true' || hashFiles('data/processed/backfill_senate.request') != '' }}
        continue-on-error: true
        timeout-minutes: 90
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGE_MODEL: google/gemini-2.5-flash-lite
        run: |
          if python -u scripts/backfill_parliament.py --senate-only; then
            rm -f data/processed/backfill_senate.request
          fi
          git config user.name "boclock-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/corpus.jsonl
          git add -u data/processed
          git commit -m "Senate hearings backfill $(date -u +%F)" || echo "nothing new"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 15
          done
      - name: Ingest new speeches and score them
        # a bankofcanada.ca outage or an OpenRouter outage must not block the deploy: the site is
        # still redeployed from the data already in the repo, and the day's new
        # documents are picked up by the next run
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGE_MODEL: google/gemini-2.5-flash-lite
        run: python -u scripts/daily_update.py
      - name: Commit updated state and data
        # a rejected commit (e.g. corpus.jsonl outgrowing GitHub's file limit) is
        # a state problem, not a reason to stop publishing the site
        continue-on-error: true
        run: |
          git config user.name "boclock-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/corpus.jsonl data/processed/tournament_log.jsonl site/data.json site/macro.json
          git add -u data/processed      # stages a consumed backfill request's removal
          git commit -m "daily update $(date -u +%F)" || echo "no changes to commit"
          # main may have moved during the run (e.g. a code push); rebase onto it
          # rather than failing the whole deploy
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed; retrying"; sleep 15
          done
      - name: Upload site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
